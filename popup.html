<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT TimeSaver</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      min-height: 100px;
      max-height: 500px;
      background: #0f0f0f;
      color: #e8e8e8;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      overflow: hidden;
    }

    header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.2px;
    }

    .logo-icon {
      width: 22px;
      height: 22px;
      background: #ff0000;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid #333;
      color: #888;
      padding: 3px 9px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
      transition: all 0.15s;
    }

    .clear-btn:hover { background: #1e1e1e; color: #ccc; border-color: #555; }

    .list {
      overflow-y: auto;
      max-height: 400px;
    }

    .empty {
      padding: 32px 16px;
      text-align: center;
      color: #555;
      line-height: 1.6;
    }

    .empty span { font-size: 28px; display: block; margin-bottom: 8px; }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-bottom: 1px solid #1c1c1c;
      cursor: pointer;
      transition: background 0.12s;
      text-decoration: none;
      color: inherit;
    }

    .item:hover { background: #181818; }

    .item:hover .delete-btn { opacity: 1; }

    .thumb {
      width: 72px;
      height: 40px;
      border-radius: 4px;
      background: #1e1e1e;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 18px;
      overflow: hidden;
      position: relative;
    }

    .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }

    .progress-bar {
      position: absolute;
      bottom: 0; left: 0;
      height: 3px;
      background: #ff0000;
      border-radius: 0 0 0 4px;
    }

    .info { flex: 1; overflow: hidden; }

    .title {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e0e0e0;
      margin-bottom: 3px;
    }

    .meta {
      font-size: 11px;
      color: #666;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ts-badge {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      padding: 1px 6px;
      border-radius: 4px;
      color: #ff4444;
      font-weight: 600;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #555;
      cursor: pointer;
      opacity: 0;
      font-size: 14px;
      padding: 4px;
      border-radius: 4px;
      transition: all 0.1s;
      flex-shrink: 0;
    }

    .delete-btn:hover { color: #ff4444; background: #1e1e1e; }

    .list::-webkit-scrollbar { width: 4px; }
    .list::-webkit-scrollbar-track { background: transparent; }
    .list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">▶</div>
      YT TimeSaver
    </div>
    <button class="clear-btn" id="clearAll">Clear all</button>
  </header>

  <div class="list" id="list">
    <div class="empty">
      <span>⏱️</span>
      No saved positions yet.<br>Watch a YouTube video and<br>your progress will appear here.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
